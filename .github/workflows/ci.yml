name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python3 -m compileall -q lkoc
      - name: Unit tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
      - name: CLI smoke
        run: PYTHONPATH=. python3 -m lkoc.cli --version
